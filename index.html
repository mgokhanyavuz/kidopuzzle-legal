<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#DFF3FF">
<link rel="icon" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KidoPuzzle</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #2C3657; --ink-soft: #6B7597; --card: #FFFFFF; --edge: #D6E6F5;
    --sky: #DFF3FF; --cream: #FFF4E6; --link: #2C7FD9;
    --green: #6CCB3C; --blue: #4FA8FF; --pink: #FF7EB3; --yellow: #FFC83D; --purple: #A48BFF; --orange: #FF9A3D;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #EEF1FB; --ink-soft: #AAB3D1; --card: #252E52; --edge: #161C36; --sky: #1B2240; --cream: #2A2346; --link: #8CC6FF; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 28px 16px 56px;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Nunito", "Segoe UI", Roboto, sans-serif;
    line-height: 1.6; color: var(--ink);
    background: linear-gradient(180deg, var(--sky) 0%, var(--cream) 100%) fixed;
  }
  .brand { max-width: 760px; margin: 0 auto 20px; text-align: center; }
  .brand a { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand img { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 4px 0 rgba(44,54,87,.15); }
  .brand span { font-size: 1.9rem; font-weight: 900; letter-spacing: -0.5px; }
  .kido { color: var(--orange); } .puzzle { color: var(--green); }
  .card {
    max-width: 760px; margin: 0 auto; padding: 28px 24px 32px;
    background: var(--card); border-radius: 28px; box-shadow: 0 6px 0 var(--edge);
  }
  h1 { font-size: 2rem; font-weight: 900; color: var(--purple); margin: 0 0 4px; line-height: 1.2; }
  h2 { font-size: 1.2rem; font-weight: 800; margin: 30px 0 8px; padding-left: 14px; border-left: 6px solid var(--blue); border-radius: 3px; }
  h2:nth-of-type(6n+2) { border-color: var(--green); } h2:nth-of-type(6n+3) { border-color: var(--pink); }
  h2:nth-of-type(6n+4) { border-color: var(--yellow); } h2:nth-of-type(6n+5) { border-color: var(--purple); }
  h2:nth-of-type(6n) { border-color: var(--orange); }
  .updated, .lead { color: var(--ink-soft); margin-top: 0; font-weight: 600; }
  a { color: var(--link); font-weight: 700; }
  li { margin: 6px 0; }
  ul { padding-left: 22px; }
  li::marker { color: var(--green); }
  .links { list-style: none; padding: 0; display: grid; gap: 12px; margin-top: 20px; }
  .links a {
    display: block; padding: 14px 18px; border-radius: 18px; text-decoration: none; color: #fff;
    font-size: 1.2rem; font-weight: 800; box-shadow: 0 5px 0 rgba(0,0,0,.18); text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .links li:nth-child(1) a { background: var(--blue); } .links li:nth-child(2) a { background: var(--green); }
  .links li:nth-child(3) a { background: var(--pink); }
  footer { max-width: 760px; margin: 22px auto 0; text-align: center; color: var(--ink-soft); font-size: .9rem; }
</style>
</head>
<body>
<header class="brand"><a href="index.html"><img src="icon.png" alt=""><span><span class="kido">Kido</span><span class="puzzle">Puzzle</span></span></a></header>
<main class="card">
<h1>Hello, grown-ups!</h1>
<p>Gentle jigsaw puzzles for toddlers and preschoolers.</p>
<ul class="links">
  <li><a href="support.html">Support</a></li>
  <li><a href="privacy.html">Privacy Policy</a></li>
  <li><a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">Terms of Use</a></li>
</ul>
</main>
<footer>© 2026 KidoPuzzle · <a href="mailto:mgokhan.yavuz@gmail.com">mgokhan.yavuz@gmail.com</a></footer>
</body>
</html>
